# nginx/mankunku.conf — Production nginx configuration for mankunkujazz.com
#
# This file is the single source of truth for the server's nginx config.
# CircleCI deploys it to /etc/nginx/sites-available/mankunku whenever this
# file, deploy/nginx/deploy.sh, or .circleci/config.yml changes on main.
# See README section "Nginx deployment" for details.
#
# Manual fallback: copy this file to the server, then run
#   bash deploy/nginx/deploy.sh /path/to/staged-config
#
# Prerequisites on the server:
#   - certbot with a Let's Encrypt certificate for mankunkujazz.com
#   - /var/www/certbot directory for ACME challenges
#   - DH parameters at /etc/letsencrypt/ssl-dhparams.pem
#   - Symlink /etc/nginx/sites-enabled/mankunku -> /etc/nginx/sites-available/mankunku

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# HTTP — redirect to HTTPS + Let's Encrypt ACME challenges
server {
	listen 80;
	server_name mankunkujazz.com;

	# Certbot ACME challenge (must remain accessible over HTTP)
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	# Redirect all other HTTP traffic to HTTPS
	location / {
		return 301 https://mankunkujazz.com$request_uri;
	}
}

# HTTPS — TLS termination + reverse proxy to SvelteKit
server {
	listen 443 ssl http2;
	server_name mankunkujazz.com;

	# --- TLS certificates (Let's Encrypt) ---
	ssl_certificate     /etc/letsencrypt/live/mankunkujazz.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/mankunkujazz.com/privkey.pem;

	# --- TLS hardening (Mozilla Intermediate profile) ---
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	ssl_prefer_server_ciphers off;

	# Session resumption (no session tickets — avoids key rotation complexity)
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	# Diffie-Hellman parameters for forward secrecy
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	# OCSP stapling — nginx caches OCSP responses, reducing client latency
	ssl_stapling on;
	ssl_stapling_verify on;
	ssl_trusted_certificate /etc/letsencrypt/live/mankunkujazz.com/chain.pem;
	resolver 8.8.8.8 8.8.4.4 valid=300s;
	resolver_timeout 5s;

	# --- Security headers ---
	# HSTS: browsers must use HTTPS for this domain (2 years)
	# Note: add_header does not inherit into location blocks that define
	# their own add_header, so HSTS is duplicated in each location block.
	add_header Strict-Transport-Security "max-age=63072000" always;

	# --- Request body limits ---
	# Tight default for every route; the two endpoints that legitimately take
	# large bodies raise it per-location below. This also closes the
	# chunked-body bypass of content-length-only gates in Node routes (e.g.
	# /api/chat): nginx enforces the cap on actual bytes. NB: without an
	# explicit value nginx's 1m default applied anyway — the per-location
	# raises below are what let the PDF import through at all.
	client_max_body_size 1m;

	# --- Application proxy rules ---

	# Vite-hashed immutable chunks — served straight from the shared pool that
	# release.sh accumulates across deploys, so a tab opened against an older
	# release can still fetch its content-hashed chunks (fixes Sentry
	# MANKUNKU-8). Path matches ${MANKUNKU_ROOT}/shared in deploy/app/release.sh.
	# Falls back to the Node server if a chunk somehow isn't in the pool.
	location /_app/immutable/ {
		alias /home/deploy/mankunku/shared/_app/immutable/;
		try_files $uri @immutable_fallback;
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header Strict-Transport-Security "max-age=63072000" always;
		access_log off;
	}

	location @immutable_fallback {
		proxy_pass http://127.0.0.1:3000;
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header Strict-Transport-Security "max-age=63072000" always;
		access_log off;
	}

	# Other Vite-hashed assets (version.json, etc.) — proxied to Node
	location /_app/ {
		proxy_pass http://127.0.0.1:3000;
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header Strict-Transport-Security "max-age=63072000" always;
		access_log off;
	}

	# Service worker — must revalidate
	location /service-worker.js {
		proxy_pass http://127.0.0.1:3000;
		expires 0;
		add_header Cache-Control "no-cache";
		add_header Strict-Transport-Security "max-age=63072000" always;
	}

	# PDF import — a base64-encoded 10MB PDF is ~13.4MB of JSON. The 16M
	# adapter cap (BODY_SIZE_LIMIT) and the route's 15MB byte-counting reader
	# remain the inner bounds.
	location = /api/tune-parse {
		client_max_body_size 16m;
		# proxy_read_timeout is the gap BETWEEN upstream reads, not the total.
		# The per-system path now answers on an NDJSON heartbeat every 3s, so
		# that gap stays small however long Fable thinks — which matters,
		# because a single system call was measured at 345s on a 4-bar crop
		# (2026-08-09) and the model does not bound that tail.
		#
		# The WHOLE-PDF fallback heartbeats too — the import page asks for
		# NDJSON on that request as well. Only a direct caller that omits the
		# `accept: application/x-ndjson` header gets one buffered JSON body,
		# silent for up to two full-document extractions, and the value still
		# has to cover that case. 420s leaves margin above the route's own
		# retry budget so the app's error reaches the client instead of an
		# nginx 504 racing it.
		proxy_read_timeout 420s;

		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_buffer_size 16k;
		proxy_buffers 8 16k;
		proxy_busy_buffers_size 32k;
	}

	# Sentry replay tunnel — envelopes run to ~1MB (MAX_ENVELOPE_SIZE_BYTES
	# is the inner bound).
	location = /api/monitoring {
		client_max_body_size 2m;

		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_buffer_size 16k;
		proxy_buffers 8 16k;
		proxy_busy_buffers_size 32k;
	}

	# Everything else — SSR pages, API routes, static files
	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# Raise the header buffer. SvelteKit can emit large response headers
		# (session cookies, CSP, etc.) that overflow the default 4k/8k buffer
		# and surface as 502 Bad Gateway. proxy_buffer_size applies even with
		# proxy_buffering off, so streaming behavior is preserved.
		#
		# proxy_buffers and proxy_busy_buffers_size are set explicitly to
		# override any values inherited from the parent http block, since
		# nginx validates the constraint
		#   proxy_busy_buffers_size ≤ (count − 1) × size
		# at parse time regardless of proxy_buffering.
		proxy_buffering off;
		proxy_buffer_size 16k;
		proxy_buffers 8 16k;
		proxy_busy_buffers_size 32k;
	}
}
