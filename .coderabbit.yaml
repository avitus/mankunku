# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  tools:
    eslint:
      enabled: false
  path_filters:
    # Claude's session logs and project memory are notes, not code: nothing
    # there is review material, and every file counts against the plan's
    # 300-file cap on a PR.
    - "!CLAUDIUS/**"
    - "!MEMORY.md"
    # Recorded takes the audio-scoring research reads: local-only data,
    # gitignored since 2026-10-08. Kept out of review should any return.
    - "!research/audio-scoring/takes/**"
